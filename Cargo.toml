[package]
name = "genlauncher"
version = "1.0.3"
edition = "2021"
rust-version = "1.89"
description = "Mod manager for Command & Conquer: Generals and Zero Hour"
default-run = "genlauncher"

[[bin]]
name = "genlauncher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico"] }

serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "charset", "http2"] }
futures-util = "0.3"

rusty-s3 = "0.7"
md-5 = "0.10"
hex = "0.4"
quick-xml = "0.37"

zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "time"] }
sevenz-rust2 = "0.13"

rfd = "0.15"
open = "5"

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
parking_lot = "0.12"
url = "2"
chrono = "0.4"
rand = "0.8"
sys-locale = "0.3"
dirs = "5"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
